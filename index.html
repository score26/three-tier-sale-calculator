<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<title>售地计算器（三档佣金）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fe4'/%3E%3Crect x='7' y='18' width='4' height='7' fill='white'/%3E%3Crect x='14' y='13' width='4' height='12' fill='white'/%3E%3Crect x='21' y='7' width='4' height='18' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --background:#f6f7f9;--card:#ffffff;--foreground:#16181c;--muted-foreground:#5c6370;
  --muted:#e9ecf1;--border:#dde1e7;--input:#ffffff;--input-border:#c6ccd6;
  --primary:#2f6fe4;--primary-foreground:#ffffff;
  --popover:#16181c;--popover-foreground:#ffffff;
  --positive:#137a3d;--positive-bg:#e5f5eb;--negative:#b3261e;--negative-bg:#fbe9e7;
  --viz-series-1:#2f6fe4;--viz-series-2:#e97b2c;--viz-series-3:#2f9e55;--viz-series-4:#d14d97;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --background:#16181c;--card:#1f2228;--foreground:#eef0f3;--muted-foreground:#a3aab5;
  --muted:#2c3038;--border:#343943;--input:#16181c;--input-border:#454b57;
  --primary:#6b9cf5;--primary-foreground:#0d1220;
  --popover:#eef0f3;--popover-foreground:#16181c;
  --positive:#6fd497;--positive-bg:#183424;--negative:#f2948c;--negative-bg:#3b1e1c;
  --viz-series-1:#6b9cf5;--viz-series-2:#f59a56;--viz-series-3:#74d58b;--viz-series-4:#f08fc0;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --background:#16181c;--card:#1f2228;--foreground:#eef0f3;--muted-foreground:#a3aab5;
  --muted:#2c3038;--border:#343943;--input:#16181c;--input-border:#454b57;
  --primary:#6b9cf5;--primary-foreground:#0d1220;
  --popover:#eef0f3;--popover-foreground:#16181c;
  --positive:#6fd497;--positive-bg:#183424;--negative:#f2948c;--negative-bg:#3b1e1c;
  --viz-series-1:#6b9cf5;--viz-series-2:#f59a56;--viz-series-3:#74d58b;--viz-series-4:#f08fc0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--background);color:var(--foreground);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif}
.tabular-nums,input[type=number]{font-variant-numeric:tabular-nums}
#tier-sale-lab{position:relative;max-width:880px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom));display:grid;gap:16px}
#tier-sale-lab [hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:1.5rem}
h2{font-size:1.1rem}
.intro{padding-top:20px}
.intro p{margin:6px 0 0;color:var(--muted-foreground)}
.intro-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--input-border);border-radius:999px;padding:3px;background:var(--card);flex:none}
.lang button{font:inherit;font-size:.9rem;min-height:38px;min-width:64px;padding:6px 14px;border:0;border-radius:999px;background:transparent;color:var(--foreground);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground);font-weight:600}

/* Sticky summary so the key numbers stay visible while adjusting inputs */
.summary{position:sticky;top:0;z-index:3;margin:0 -16px;padding:10px 16px calc(10px);background:color-mix(in srgb,var(--background) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.summary div{min-width:0}
.summary .k{display:block;font-size:.75rem;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary .v{display:block;font-weight:650;font-size:1.05rem;white-space:nowrap}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;display:grid;gap:14px;min-width:0}
.form-label{display:grid;gap:6px;font-weight:550;font-size:.95rem}
.hint{font-weight:400;color:var(--muted-foreground);font-size:.85rem}
.text-small{font-size:.875rem;color:var(--muted-foreground)}
.text-destructive{color:var(--negative);background:var(--negative-bg);padding:10px 12px;border-radius:10px}
.form-control{width:100%;min-width:0;font:inherit;font-size:16px;color:var(--foreground);background:var(--input);border:1px solid var(--input-border);border-radius:10px;padding:10px 12px;min-height:44px}
.form-control:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:transparent}
.euro{position:relative;display:block}
.euro::before{content:"€";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-foreground);pointer-events:none}
.euro .form-control{padding-left:28px}

/* Range sliders with large touch-friendly thumbs */
.form-range{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y}
.form-range::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--muted)}
.form-range::-moz-range-track{height:6px;border-radius:3px;background:var(--muted)}
.form-range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--primary);border:3px solid var(--card);box-shadow:0 1px 4px rgb(0 0 0/.3);margin-top:-11px}
.form-range::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--primary);border:3px solid var(--card);box-shadow:0 1px 4px rgb(0 0 0/.3)}
.form-range:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

.price-value{font-size:1.75rem;font-weight:700}
.price-row{display:grid;grid-template-columns:minmax(0,1fr) 150px;align-items:center;gap:16px}
.thresholds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tier{display:grid;gap:4px;padding:12px;border-radius:10px;background:color-mix(in srgb,var(--muted) 55%,transparent);border-left:4px solid var(--c)}
.tier .form-label{font-size:.9rem}
.rate-row{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;align-items:center}
.rate-number{display:flex;align-items:center;gap:5px;min-width:0}
.settings{display:grid;gap:4px}
.form-check{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.form-check-input{width:22px;height:22px;margin:0;accent-color:var(--primary);flex:none}

.viz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.viz-stat{gap:4px}
.viz-stat-value{font-size:1.6rem;font-weight:700}
.viz-stat.primary{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}

.viz-row{display:flex;flex-wrap:wrap;gap:8px 20px}
#ts-chart{display:block;width:100%;overflow:visible}
#ts-chart-wrap,#ts-chart2-wrap{min-width:0}
#ts-chart2{display:block;width:100%;overflow:visible}
.tax-controls{display:grid;gap:12px}
.breakdown td{padding:9px 4px}
.breakdown td:first-child{color:var(--muted-foreground)}
.breakdown tr.total td{font-weight:700;color:var(--foreground);border-bottom:0;border-top:2px solid var(--foreground)}
.breakdown tr.lead td{color:var(--foreground);font-weight:600}
svg .mark-label{font-size:11px;fill:var(--muted-foreground)}
#ts-chart0-wrap{min-width:0}
#ts-chart0{display:block;width:100%;overflow:visible}
.chart-line{fill:none;stroke-width:2.5}
svg text{fill:var(--foreground);font-size:12px}
.legend-series{display:inline-flex;align-items:center;gap:8px;background:transparent;border:0;color:var(--foreground);padding:8px 0;min-height:44px;font:inherit;font-size:.9rem;cursor:pointer}
.legend-series[aria-pressed="false"]{opacity:.45}
.swatch{display:inline-block;width:22px;height:3px;background:var(--viz-series-1)}
.original-swatch{background:repeating-linear-gradient(90deg,var(--viz-series-4) 0 6px,transparent 6px 10px)}
#ts-stacks{display:grid;gap:14px}
.stack-label{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.95rem}
.stack-track{display:flex;height:24px;background:var(--muted);margin-top:6px;border-radius:6px;overflow:hidden}
.stack-segment{height:100%;min-width:0;transition:width .18s ease}
.stack-key{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:8px}
.key-dot{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px}

.table-responsive{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:10px 4px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{font-size:.8rem;color:var(--muted-foreground);font-weight:600}
.text-end{text-align:right;white-space:nowrap}
tr.highlight td{font-weight:650}
#ts-win{padding:12px 14px;border-radius:10px;font-weight:550}
#ts-win.good{background:var(--positive-bg);color:var(--positive)}
#ts-win.bad{background:var(--negative-bg);color:var(--negative)}
.foot{line-height:1.5}
.actions{display:flex;justify-content:center}
.btn{font:inherit;font-size:.95rem;min-height:44px;padding:10px 20px;border-radius:999px;border:1px solid var(--input-border);background:var(--card);color:var(--foreground);cursor:pointer}
.btn:active{background:var(--muted)}
#ts-tooltip{position:absolute;pointer-events:none;z-index:4;background:var(--popover);color:var(--popover-foreground);padding:10px 12px;border-radius:8px;font-size:.85rem;max-width:240px;box-shadow:0 4px 14px rgb(0 0 0/.2)}

@media(max-width:620px){
  h1{font-size:1.3rem}
  .tiers{grid-template-columns:1fr;gap:12px}
  .thresholds{grid-template-columns:1fr;gap:12px}
  .price-row{grid-template-columns:minmax(0,1fr) 128px;gap:12px}
  .summary .v{font-size:.95rem}
  .viz-stat-value{font-size:1.4rem}
}
@media(prefers-reduced-motion:reduce){.stack-segment{transition:none}}
</style>
</head>
<body>
<div id="tier-sale-lab">
  <header class="intro">
    <div class="intro-top">
      <h1 data-i18n="title"></h1>
      <div class="lang" role="group" aria-label="Language / 语言">
        <button type="button" data-lang="en" lang="en">English</button><button type="button" data-lang="zh" lang="zh-Hans">中文</button>
      </div>
    </div>
    <p data-i18n="intro"></p>
  </header>

  <div class="summary" aria-live="polite">
    <div><span class="k" data-i18n="sumPrice"></span><span class="v tabular-nums" id="ts-sum-price"></span></div>
    <div><span class="k" data-i18n="sumBroker"></span><span class="v tabular-nums" id="ts-sum-broker"></span></div>
    <div><span class="k" data-i18n="sumSeller"></span><span class="v tabular-nums" id="ts-sum-seller"></span></div>
  </div>

  <section class="card">
    <h2 data-i18n="hPrice"></h2>
    <div class="price-value tabular-nums" id="ts-price-label"></div>
    <div class="price-row">
      <input id="ts-price" class="form-range" type="range" min="500000" max="1200000" step="1000" value="800000" data-i18n-aria="ariaPriceSlider">
      <span class="euro"><input id="ts-price-number" class="form-control" type="number" inputmode="numeric" data-i18n-aria="ariaPriceInput" min="100000" max="3000000" step="1000" value="800000"></span>
    </div>
    <div id="ts-chart0-wrap"><svg id="ts-chart0" role="img" data-i18n-aria="ariaChart0"></svg></div>
    <div class="text-small" data-i18n="chart0Note"></div>
  </section>

  <section class="card">
    <h2 data-i18n="hTiers"></h2>
    <div class="thresholds">
      <label class="form-label"><span data-i18n="t1Label"></span><span class="euro"><input id="ts-t1" class="form-control" type="number" inputmode="numeric" min="100000" max="2000000" step="10000" value="700000"></span></label>
      <label class="form-label"><span data-i18n="t2Label"></span><span class="euro"><input id="ts-t2" class="form-control" type="number" inputmode="numeric" min="100001" max="2500000" step="10000" value="750000"></span></label>
    </div>
    <div id="ts-error" class="text-destructive" role="alert" hidden></div>
    <div class="tiers">
      <div class="tier" style="--c:var(--viz-series-1)"><label class="form-label" for="ts-r1"><span data-i18n="tier" data-n="1"></span> <span class="hint" id="ts-band1"></span></label><div class="rate-row"><input id="ts-r1" class="form-range" type="range" min="0" max="15" step="0.25" value="4.5" data-i18n-aria="ariaRate" data-n="1"><label class="rate-number"><input id="ts-r1-number" class="form-control" type="number" inputmode="decimal" data-i18n-aria="ariaRate" data-n="1" min="0" max="100" step="0.25" value="4.5">%</label></div><div class="text-small" id="ts-part1"></div></div>
      <div class="tier" style="--c:var(--viz-series-2)"><label class="form-label" for="ts-r2"><span data-i18n="tier" data-n="2"></span> <span class="hint" id="ts-band2"></span></label><div class="rate-row"><input id="ts-r2" class="form-range" type="range" min="0" max="25" step="0.25" value="10" data-i18n-aria="ariaRate" data-n="2"><label class="rate-number"><input id="ts-r2-number" class="form-control" type="number" inputmode="decimal" data-i18n-aria="ariaRate" data-n="2" min="0" max="100" step="0.25" value="10">%</label></div><div class="text-small" id="ts-part2"></div></div>
      <div class="tier" style="--c:var(--viz-series-3)"><label class="form-label" for="ts-r3"><span data-i18n="tier" data-n="3"></span> <span class="hint" id="ts-band3"></span></label><div class="rate-row"><input id="ts-r3" class="form-range" type="range" min="0" max="40" step="0.25" value="15" data-i18n-aria="ariaRate" data-n="3"><label class="rate-number"><input id="ts-r3-number" class="form-control" type="number" inputmode="decimal" data-i18n-aria="ariaRate" data-n="3" min="0" max="100" step="0.25" value="15">%</label></div><div class="text-small" id="ts-part3"></div></div>
    </div>
    <p class="text-small" style="margin:0" data-i18n="tierNote"></p>
  </section>

  <section class="card">
    <h2 data-i18n="hFees"></h2>
    <div class="settings">
      <label class="form-check"><input id="ts-vat" class="form-check-input" type="checkbox" checked><span data-i18n="vatCheck"></span></label>
      <label class="form-check"><input id="ts-legal" class="form-check-input" type="checkbox" checked><span data-i18n="legalCheck"></span></label>
    </div>
    <div id="ts-legal-controls" class="thresholds">
      <label class="form-label"><span data-i18n="s1Label"></span><span class="rate-number"><input id="ts-s1" class="form-control" type="number" inputmode="decimal" min="0" max="20" step="0.25" value="1.25">%</span></label>
      <label class="form-label"><span data-i18n="s2Label"></span><span class="rate-number"><input id="ts-s2" class="form-control" type="number" inputmode="decimal" min="0" max="20" step="0.25" value="2">%</span></label>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="hTax"></h2>
    <label class="form-check"><input id="ts-tax" class="form-check-input" type="checkbox" checked><span data-i18n="taxCheck"></span></label>
    <div id="ts-tax-controls" class="tax-controls">
      <div class="thresholds">
        <label class="form-label"><span data-i18n="buyLabel"></span><span class="hint" data-i18n="buyHint"></span><span class="euro"><input id="ts-buy" class="form-control" type="number" inputmode="numeric" min="0" max="5000000" step="1000" value="650000"></span></label>
        <label class="form-label"><span data-i18n="coefLabel"></span><span class="hint" data-i18n="coefHint"></span><input id="ts-coef" class="form-control" type="number" inputmode="decimal" min="1" max="10" step="0.01" value="1.20"></label>
        <label class="form-label"><span data-i18n="buyCostsLabel"></span><span class="hint" data-i18n="buyCostsHint"></span><span class="euro"><input id="ts-buycosts" class="form-control" type="number" inputmode="numeric" min="0" max="1000000" step="100" value="0"></span></label>
        <label class="form-label"><span data-i18n="otherLabel"></span><span class="hint" data-i18n="otherHint"></span><span class="euro"><input id="ts-other" class="form-control" type="number" inputmode="numeric" min="0" max="5000000" step="1000" value="0"></span></label>
      </div>
      <label class="form-check"><input id="ts-deduct" class="form-check-input" type="checkbox" checked><span data-i18n="deductCheck"></span></label>
      <p class="text-small" id="ts-tax-basis" style="margin:0"></p>
    </div>
  </section>

  <div class="viz-grid" aria-live="polite">
    <div class="card viz-stat"><div class="text-small" data-i18n="stProposed"></div><div class="viz-stat-value tabular-nums" id="ts-proposed"></div><div class="text-small" id="ts-effective"></div></div>
    <div class="card viz-stat"><div class="text-small" data-i18n="stOriginal"></div><div class="viz-stat-value tabular-nums" id="ts-original"></div><div class="text-small" id="ts-fee-delta"></div></div>
    <div class="card viz-stat"><div class="text-small" data-i18n="stCgt"></div><div class="viz-stat-value tabular-nums" id="ts-cgt"></div><div class="text-small" id="ts-cgt-note"></div></div>
    <div class="card viz-stat primary"><div class="text-small" data-i18n="stSeller"></div><div class="viz-stat-value tabular-nums" id="ts-seller"></div><div class="text-small" id="ts-seller-note"></div></div>
  </div>

  <section class="card">
    <h2 data-i18n="hBreakdown"></h2>
    <table class="breakdown"><tbody id="ts-breakdown"></tbody></table>
  </section>

  <section class="card">
    <h2 data-i18n="hCosts"></h2>
    <p class="text-small" style="margin:0" data-i18n="costsNote"></p>
    <div id="ts-legend2" class="viz-row"></div>
    <div id="ts-chart2-wrap"><svg id="ts-chart2" role="img" data-i18n-aria="ariaChart2"></svg></div>
    <div class="text-small" id="ts-tax-start"></div>
  </section>

  <section class="card">
    <h2 data-i18n="hBroker"></h2>
    <div id="ts-legend" class="viz-row"></div>
    <div id="ts-chart-wrap"><svg id="ts-chart" role="img" data-i18n-aria="ariaChart"></svg></div>
    <div class="text-small" data-i18n="chartNote"></div>
  </section>

  <section class="card">
    <h2 data-i18n="hStacks"></h2>
    <div id="ts-stacks" role="img" data-i18n-aria="ariaStacks"></div>
  </section>

  <section class="card">
    <h2 data-i18n="hRef"></h2>
    <label class="form-label"><span data-i18n="refLabel"></span><span class="hint"><span data-i18n="refHint"></span><span id="ts-reference-legal"></span></span><span class="euro" style="max-width:260px"><input id="ts-reference" class="form-control" type="number" inputmode="numeric" min="100000" max="3000000" step="10000" value="760000"></span></label>
    <div class="table-responsive"><table><thead><tr><th data-i18n="thScenario"></th><th class="text-end" data-i18n="thBroker"></th><th class="text-end" data-i18n="thSeller"></th></tr></thead><tbody id="ts-results"></tbody></table></div>
    <div id="ts-win" aria-live="polite"></div>
    <div id="ts-match" class="text-small"></div>
  </section>

  <div class="text-small foot" data-i18n="foot"></div>
  <div class="actions"><button type="button" class="btn" id="ts-reset" data-i18n="reset"></button></div>
  <div id="ts-tooltip" role="tooltip" hidden></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(()=>{
const root=document.getElementById('tier-sale-lab'),q=id=>root.querySelector('#ts-'+id),euro=new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR',maximumFractionDigits:0}),num=new Intl.NumberFormat('en-IE',{maximumFractionDigits:2}),fmt=v=>euro.format(v),signed=v=>(v>=0?'+':'−')+fmt(Math.abs(v)),k=v=>'€'+num.format(v/1000)+'k';
// All visible text, in English and Simplified Chinese. {x} placeholders are filled by t().
const I18N={
en:{
  docTitle:'Three-Tier Sale Calculator',title:'Three-tier sale calculator',intro:'Compare the proposed tiered broker fee with the original flat 5%. Move the sliders or type a number — everything updates instantly.',
  sumPrice:'Sale price',sumBroker:'Broker fee',sumSeller:'Seller keeps',
  hPrice:'Sale price',ariaPriceSlider:'Sale price slider',ariaPriceInput:'Sale price in euros',ariaChart0:'What the seller keeps after fees and tax at each sale price',chart0Note:'The dot is the price above. Tap the chart to read any price.',

  chart:{label:t('yBroker'),series:[{color:proposedColor,f:p=>broker(p,s)},{color:originalColor,dash:'6 4',f:p=>p*.05}],marks:[],
    tip:p=>sale(p)+(visible.chart[0]?div(t('tipPropBroker',{a:fmt(broker(p,s))})):'')+(visible.chart[1]?div(t('tipOrig5',{a:fmt(p*.05)})):'')}
};
}
function drawAll(){if(typeof d3==='undefined'){['chart0','chart','chart2'].forEach(id=>q(id+'-wrap').textContent=t('chartNA'));return}if(!state)return;const s=state,sp=specs(s);
// Shared x range so the charts line up; include where tax starts if it is nearby.
const start=taxStart(s),anchors=[s.p,s.ref,s.t1,s.t2];if(start!==null&&start>0&&start<Math.max(...anchors)*1.4)anchors.push(start);
const extent=d3.extent(anchors),pad=Math.max(50000,(extent[1]-extent[0])*.3),lo=Math.max(0,extent[0]-pad),hi=extent[1]+pad;
const prices=Array.from(new Set([...d3.range(lo,hi,(hi-lo)/200),hi,s.t1,s.t2,s.p,s.ref,...(start?[start]:[])])).filter(v=>v>=lo&&v<=hi).sort((a,b)=>a-b);
Object.keys(sp).forEach(id=>draw(id,sp[id],lo,hi,prices));
}
function draw(id,spec,lo,hi,prices){const s=state,vis=visible[id],svgNode=q(id);
const width=Math.max(280,q(id+'-wrap').getBoundingClientRect().width),narrow=width<440,height=spec.height||(narrow?240:285),margin={left:narrow?56:70,right:12,top:16,bottom:53},svg=d3.select(svgNode).attr('viewBox','0 0 '+width+' '+height).attr('height',height);
svg.selectAll('*').remove();
const ys=prices.flatMap(p=>spec.series.filter((_,i)=>vis[i]).map(se=>se.f(p))),yd=ys.length?d3.extent(ys):[0,1],yp=Math.max(1000,(yd[1]-yd[0])*.14);
const x=d3.scaleLinear().domain([lo,hi]).range([margin.left+4,width-margin.right-4]),y=d3.scaleLinear().domain([Math.max(0,yd[0]-yp),yd[1]+yp]).nice().range([height-margin.bottom-4,margin.top+4]);
const left=margin.left,right=width-margin.right,top=margin.top,bottom=height-margin.bottom,clip='ts-clip-'+id;
svg.append('rect').attr('x',left).attr('y',top).attr('width',right-left).attr('height',bottom-top).attr('fill','none').attr('stroke','var(--border)');
svg.append('defs').append('clipPath').attr('id',clip).append('rect').attr('x',left).attr('y',top).attr('width',right-left).attr('height',bottom-top);
const yAxis=svg.append('g').attr('transform','translate('+left+',0)').call(d3.axisLeft(y).ticks(4).tickFormat(k).tickSize(0));yAxis.select('.domain').remove();yAxis.selectAll('text').attr('dx',-5);
y.ticks(4).forEach(v=>svg.append('line').attr('x1',left).attr('x2',right).attr('y1',y(v)).attr('y2',y(v)).attr('stroke','var(--border)').attr('stroke-width',.7));
const xAxis=d3.axisBottom(x).ticks(5).tickFormat(k).tickSize(0);if(narrow)xAxis.ticks(3);const xa=svg.append('g').attr('transform','translate(0,'+bottom+')').call(xAxis);xa.select('.domain').remove();xa.selectAll('text').attr('dy','1.5em');
svg.append('text').attr('x',(left+right)/2).attr('y',height-5).attr('text-anchor','middle').text(t('axisX'));
svg.append('text').attr('transform','translate(12,'+((top+bottom)/2)+') rotate(-90)').attr('text-anchor','middle').text(spec.label);
const plot=svg.append('g').attr('clip-path','url(#'+clip+')');
spec.marks.forEach(m=>{if(m.x<lo||m.x>hi)return;const mx=x(m.x);plot.append('line').attr('x1',mx).attr('x2',mx).attr('y1',top).attr('y2',bottom).attr('stroke','var(--negative)').attr('stroke-dasharray','3 3');svg.append('text').attr('class','mark-label').attr('x',mx+(mx>(left+right)/2?-4:4)).attr('y',top+13).attr('text-anchor',mx>(left+right)/2?'end':'start').text(m.label+' '+k(Math.ceil(m.x/1000)*1000))});
plot.append('line').attr('x1',x(s.p)).attr('x2',x(s.p)).attr('y1',top).attr('y2',bottom).attr('stroke','var(--border)');
spec.series.forEach((se,i)=>{if(!vis[i])return;plot.append('path').datum(prices).attr('class','chart-line').attr('stroke',se.color).attr('stroke-dasharray',se.dash||null).attr('d',d3.line().x(p=>x(p)).y(p=>y(se.f(p))));plot.append('circle').attr('cx',x(s.p)).attr('cy',y(se.f(s.p))).attr('r',5).attr('fill',se.color)});
const guide=plot.append('line').attr('data-chart-hover-guide','').attr('y1',top).attr('y2',bottom).attr('stroke','var(--foreground)').attr('stroke-width',1).attr('visibility','hidden'),markers=spec.series.map(se=>plot.append('circle').attr('data-chart-hover-marker','').attr('r',5).attr('fill',se.color).attr('visibility','hidden'));
const tooltip=q('tooltip');function hover(event){hideGuidesExcept(svgNode);const point=d3.pointer(event,svgNode),px=Math.max(left,Math.min(right,point[0])),price=x.invert(px);guide.attr('x1',px).attr('x2',px).attr('visibility','visible');markers.forEach((m,i)=>m.attr('cx',px).attr('cy',y(spec.series[i].f(price))).attr('visibility',vis[i]?'visible':'hidden'));tooltip.hidden=false;tooltip.innerHTML=spec.tip(price);const rr=root.getBoundingClientRect(),sr=svgNode.getBoundingClientRect(),tw=tooltip.offsetWidth;let tx=sr.left-rr.left+px+12;if(tx+tw>sr.right-rr.left)tx=sr.left-rr.left+px-tw-12;tooltip.style.left=Math.max(sr.left-rr.left,tx)+'px';tooltip.style.top=(sr.top-rr.top+top+8)+'px'}
svg.append('rect').attr('x',left).attr('y',top).attr('width',right-left).attr('height',bottom-top).attr('fill','transparent').style('touch-action','pan-y').style('cursor','crosshair')
  .on('pointermove',e=>{if(!pinned||e.pointerType!=='mouse')hover(e)})
  .on('pointerdown',e=>{if(e.pointerType!=='mouse'){pinned=true;hover(e)}})
  .on('pointerleave',e=>{if(!pinned&&e.pointerType==='mouse')hideTip()})
  .on('click',e=>{if(e.pointerType==='mouse'||!e.pointerType)pinned=!pinned;hover(e)});
// Keep edge tick labels inside the measured container.
xa.selectAll('text').each(function(){const b=this.getBoundingClientRect(),r=svgNode.getBoundingClientRect();if(b.left<r.left+4)d3.select(this).attr('text-anchor','start');if(b.right>r.right-4)d3.select(this).attr('text-anchor','end')});
}
function hideGuidesExcept(svgNode){d3.select(root).selectAll('svg').filter(function(){return this!==svgNode}).selectAll('[data-chart-hover-guide],[data-chart-hover-marker]').attr('visibility','hidden')}
function legend(id,target){[['legProp',''],['legOrig','original-swatch']].forEach((item,i)=>{const button=document.createElement('button');button.type='button';button.className='legend-series';button.dataset.key=item[0];button.setAttribute('aria-pressed','true');button.innerHTML='<span class="swatch '+item[1]+'"></span><span></span>';button.addEventListener('click',()=>{visible[id][i]=!visible[id][i];button.setAttribute('aria-pressed',String(visible[id][i]));hideTip();drawAll()});q(target).appendChild(button)})}
legend('chart','legend');legend('chart2','legend2');
function pair(slider,field){q(slider).addEventListener('input',()=>{q(field).value=q(slider).value;render()});q(field).addEventListener('input',()=>{const v=Number(q(field).value);if(Number.isFinite(v)){if(v>Number(q(slider).max))q(slider).max=String(v);q(slider).value=String(v)}render()})}
pair('price','price-number');for(let i=1;i<=3;i++)pair('r'+i,'r'+i+'-number');['t1','t2','s1','s2','reference','vat','legal','tax','buy','coef','buycosts','other','deduct'].forEach(id=>q(id).addEventListener('input',render));
q('reset').addEventListener('click',reset);
root.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem(langKey,lang)}catch(e){}applyLang()}));
// Tapping anywhere outside a chart dismisses a pinned tooltip.
document.addEventListener('pointerdown',e=>{if(pinned&&!e.target.closest('svg'))hideTip()});
root.saleCalculator={get,broker,legal,fees,irs,gain,cgt,net,taxStart,portions,catchup,render,setLang:l=>{lang=l;applyLang()}};restore();applyLang();
const ro=new ResizeObserver(()=>drawAll());ro.observe(q('chart-wrap'));
})();
</script>
